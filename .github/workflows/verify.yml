name: verify

on:
  push:
  pull_request:

# A PR fails if any proof in this repository stops verifying.
jobs:
  verus:
    name: Verus proof check
    runs-on: ubuntu-24.04
    env:
      # Pinned Verus release. The Rust toolchain below must be the one this
      # release was built against (see rust-toolchain.toml).
      VERUS_VERSION: 0.2026.09.13.671956e
      VERUS_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain Verus was built against
        run: |
          rustup toolchain install "$VERUS_TOOLCHAIN" \
            --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt

      - name: Restore the Verus release from cache
        id: verus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          curl --fail --location --silent --show-error -o /tmp/verus.zip "$url"
          unzip -q /tmp/verus.zip -d /tmp/verus-unpacked
          mv /tmp/verus-unpacked/verus-x86-linux "$HOME/verus"
          chmod +x "$HOME/verus/verus" "$HOME/verus/rust_verify" "$HOME/verus/z3" "$HOME/verus/cargo-verus"

      # Saved unconditionally so that a run whose proofs failed still primes the
      # cache for the next attempt.
      - name: Save the Verus release to cache
        if: steps.verus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Put Verus on PATH
        run: echo "$HOME/verus" >> "$GITHUB_PATH"

      - name: Report Verus version
        run: verus --version

      - name: Verify all proofs
        run: |
          set -o pipefail
          verus --crate-type=lib src/lib.rs --triggers-mode silent | tee /tmp/verus-output.txt
          grep -E '^verification results' /tmp/verus-output.txt >> "$GITHUB_STEP_SUMMARY"

      # The README claims the proofs use no escape hatches. Enforce that claim.
      - name: Reject verification escape hatches
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9_])(assume|admit)[[:space:]]*\(|external_body|assume_specification|verifier::external'
          if grep -rnE "$pattern" src/; then
            echo "::error::found a verification escape hatch in src/"
            exit 1
          fi
          echo "no escape hatches found"

  # The crate is also a normal Cargo package. This job checks that the `vstd`
  # version pinned in Cargo.toml really is the one this Verus release expects,
  # so the Cargo entry point is not an untested claim.
  cargo-verus:
    name: cargo verus verify
    runs-on: ubuntu-24.04
    env:
      VERUS_VERSION: 0.2026.09.13.671956e
      VERUS_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain Verus was built against
        run: |
          rustup toolchain install "$VERUS_TOOLCHAIN" \
            --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt

      - name: Restore the Verus release from cache
        id: verus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          curl --fail --location --silent --show-error -o /tmp/verus.zip "$url"
          unzip -q /tmp/verus.zip -d /tmp/verus-unpacked
          mv /tmp/verus-unpacked/verus-x86-linux "$HOME/verus"
          chmod +x "$HOME/verus/verus" "$HOME/verus/rust_verify" "$HOME/verus/z3" "$HOME/verus/cargo-verus"

      - name: Put Verus on PATH
        run: echo "$HOME/verus" >> "$GITHUB_PATH"

      - name: Verify through cargo-verus
        run: cargo verus verify

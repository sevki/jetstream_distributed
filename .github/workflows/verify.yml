name: verify

on:
  # Pull requests cover branch work; restricting `push` to the default branch
  # avoids running the whole suite twice for every commit on a PR branch.
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref rather than letting them compete
# for runners: the proof check is long enough that stacked runs were being
# reclaimed mid-verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A PR fails if any proof in this repository stops verifying.
jobs:
  verus:
    name: Verus proof check
    runs-on: ubuntu-24.04
    # Bound the job: a hung verification is a CI defect in its own right, and a
    # timeout gives a reportable failure instead of a runner that vanishes.
    timeout-minutes: 15
    env:
      # Pinned Verus release. The Rust toolchain below must be the one this
      # release was built against (see rust-toolchain.toml).
      VERUS_VERSION: 0.2026.09.13.671956e
      VERUS_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain Verus was built against
        run: |
          rustup toolchain install "$VERUS_TOOLCHAIN" \
            --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt

      - name: Restore the Verus release from cache
        id: verus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          curl --fail --location --silent --show-error -o /tmp/verus.zip "$url"
          unzip -q /tmp/verus.zip -d /tmp/verus-unpacked
          mv /tmp/verus-unpacked/verus-x86-linux "$HOME/verus"
          chmod +x "$HOME/verus/verus" "$HOME/verus/rust_verify" "$HOME/verus/z3" "$HOME/verus/cargo-verus"

      # Saved unconditionally so that a run whose proofs failed still primes the
      # cache for the next attempt.
      - name: Save the Verus release to cache
        if: steps.verus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Put Verus on PATH
        run: echo "$HOME/verus" >> "$GITHUB_PATH"

      - name: Report Verus version
        run: verus --version

      # `--profile` is a diagnostic, not a behaviour change: it only reports on
      # functions that exceed the solver's resource limit, naming the quantifiers
      # being instantiated. It costs nothing when everything verifies.
      #
      # `set -euo pipefail` is written out rather than left to the runner's
      # default `bash -e`: the exit status of the verifier is the whole point of
      # this step, and it should not depend on an implicit property of the
      # environment. The explicit check on the summary is defence in depth on
      # top of that - a verifier that ever reported errors while exiting 0 would
      # otherwise pass silently.
      - name: Verify all proofs
        run: |
          set -euo pipefail
          verus --crate-type=lib src/lib.rs --triggers-mode silent --profile \
            | tee /tmp/verus-output.txt

          summary=$(grep -E '^verification results' /tmp/verus-output.txt || true)
          if [ -z "$summary" ]; then
            echo "::error::verus produced no verification summary"
            exit 1
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

          # `[^0-9]0 errors` so that "10 errors" cannot satisfy "0 errors".
          if ! printf '%s\n' "$summary" | grep -qE '(^|[^0-9])0 errors'; then
            echo "::error::verification summary reports errors: $summary"
            exit 1
          fi

      # The README claims the proofs use no escape hatches. Enforce that claim.
      # `axiom` is matched as a whole word because Verus really does have a
      # `pub broadcast axiom fn ...` declaration form, which would otherwise let
      # an undischarged assumption underpin a "verified" theorem. Whole-word
      # matching leaves vstd's `axiom_*` lemma names alone, but it does mean
      # prose in `src/` must not use the bare word.
      - name: Reject verification escape hatches
        run: |
          set -euo pipefail
          pattern='(^|[^A-Za-z0-9_])(assume|admit)[[:space:]]*\(|(^|[^A-Za-z0-9_])axiom([^A-Za-z0-9_]|$)|external_body|assume_specification|verifier::external'
          if grep -rnE "$pattern" src/; then
            echo "::error::found a verification escape hatch in src/"
            exit 1
          fi
          echo "no escape hatches found"

  # The crate is also a normal Cargo package. This job verifies it through the
  # Cargo entry point, against the `vstd` version pinned in Cargo.toml rather
  # than the prebuilt one inside the Verus release - so the pin is checked, and
  # the Cargo entry point is not an untested claim.
  cargo-verus:
    name: cargo verus verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERUS_VERSION: 0.2026.09.13.671956e
      VERUS_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain Verus was built against
        run: |
          rustup toolchain install "$VERUS_TOOLCHAIN" \
            --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt

      - name: Restore the Verus release from cache
        id: verus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-x86-linux

      - name: Download Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          curl --fail --location --silent --show-error -o /tmp/verus.zip "$url"
          unzip -q /tmp/verus.zip -d /tmp/verus-unpacked
          mv /tmp/verus-unpacked/verus-x86-linux "$HOME/verus"
          chmod +x "$HOME/verus/verus" "$HOME/verus/rust_verify" "$HOME/verus/z3" "$HOME/verus/cargo-verus"

      - name: Put Verus on PATH
        run: echo "$HOME/verus" >> "$GITHUB_PATH"

      # `cargo verus verify` only verifies crates that opt in via
      # `[package.metadata.verus] verify = true`. Without that it builds this
      # crate with ordinary rustc, verifies `vstd` alone, prints *vstd's*
      # `verification results` line and exits 0 - a false green that a naive
      # grep for the summary does not catch, because the summary is there.
      #
      # So the check is positional: a verification summary has to appear after
      # the line where Cargo starts compiling this crate. vstd's summary is
      # emitted before that point and cannot satisfy it.
      - name: Verify through cargo-verus
        run: |
          set -euo pipefail
          cargo verus verify 2>&1 | tee /tmp/cargo-verus.txt

          if grep -q 'did not find any crates that opted into verification' /tmp/cargo-verus.txt; then
            echo "::error::cargo verus verified nothing in this crate - is [package.metadata.verus] verify = true still in Cargo.toml?"
            exit 1
          fi

          # `|| true` so that a missing line reaches the diagnostic below rather
          # than aborting the step under `set -e` with no explanation.
          start=$(grep -n 'Checking distributed-ownership' /tmp/cargo-verus.txt | tail -1 | cut -d: -f1 || true)
          if [ -z "$start" ]; then
            echo "::error::cargo verus never compiled this crate, so it cannot have verified it"
            exit 1
          fi

          summary=$(awk -v n="$start" 'NR > n && /verification results/' /tmp/cargo-verus.txt)
          if [ -z "$summary" ]; then
            echo "::error::no verification summary for this crate - cargo verus built it without verifying it"
            exit 1
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

          if ! printf '%s\n' "$summary" | grep -qE '(^|[^0-9])0 errors'; then
            echo "::error::this crate's verification summary reports errors: $summary"
            exit 1
          fi

  # The simulation. Separate from the two verification jobs on purpose: it is
  # evidence of a different kind and it fails for different reasons. A proof
  # that stops verifying means the model is wrong; a scenario that fails means
  # the implementation and the model disagree, and which of them is wrong is
  # then the interesting question.
  #
  # This job needs no Verus toolchain: `cargo test` builds the crate with
  # ordinary rustc, where `verus!` erases its ghost code and leaves the one
  # executable item - `FenceGuard` - behind.
  simulation:
    name: Turmoil scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The same Rust toolchain the proof jobs install. Verus itself is not
      # needed here, but the compiler is still pinned: a simulation built by a
      # different rustc is not evidence about the code the proofs are checked
      # against.
      VERUS_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # Named explicitly rather than left to rust-toolchain.toml. Cargo does
      # honour that file, and the cache step's log confirms this job has been
      # building with 1.98.1 all along — so this is not a fix for a job that
      # was using the wrong compiler. It is a fix for a step that could not say
      # which compiler it meant: `rustup show active-toolchain || rustup
      # toolchain install` names no version, so reading it tells you nothing
      # about what will be installed, and its fallback takes no argument. The
      # other two jobs state the toolchain; this one now states the same one,
      # from the same variable.
      - name: Install the Rust toolchain the proofs are built with
        run: |
          rustup toolchain install "$VERUS_TOOLCHAIN" \
            --component rustc-dev,llvm-tools,rust-std,cargo,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: simulation

      # Built as its own step so that a compile failure is reported as one.
      # `RUSTFLAGS: -D warnings` is deliberately *not* set: RUSTFLAGS reaches
      # every dependency too, and a warning in `vstd` or `turmoil` would fail
      # this job for something no change here could fix.
      - name: Build the scenarios
        run: cargo test --no-run --tests

      # The regression corpus claims a seed reproduces a failure exactly. That
      # is a claim about the whole dependency graph, not only about this crate:
      # a different `turmoil` patch release is a different simulator, and would
      # reinterpret every committed seed without a change here. The direct
      # dependencies are pinned exactly and `Cargo.lock` is committed; printing
      # the resolved graph makes any drift visible in the log rather than only
      # in a diff nobody reads.
      - name: Show the resolved dependency graph
        run: cat Cargo.lock

      # The named stories first: each one asserts what it was supposed to
      # reach, so a failure here names the property rather than a seed. That
      # includes `oracles_catch_an_unfenced_coordinator`, which is what makes a
      # green run of the search below mean anything.
      - name: Named ownership stories
        run: cargo test --test turmoil_ownership -- --nocapture

      # Then the blind search. The window is fixed on a pull request so that a
      # red result means the change did it; `JETSTREAM_SCENARIO_START` moves it
      # for anyone who wants to search further.
      - name: Scenario search
        run: cargo test --test turmoil_scenarios -- --nocapture

      # And the search over what *arrives* at the registry rather than over
      # what a correct node would send. The two are not interchangeable: the
      # action alphabet emits only well-formed requests, so every guard against
      # a malformed one is unreachable from the search above however long it
      # runs. Six of those guards had to be written by hand, one test each,
      # after a reviewer pointed at each in turn.
      #
      # The window is fixed here for the same reason the scenario window is:
      # a red result has to mean the change did it, not that the runner drew
      # different seeds. `JETSTREAM_PROTOCOL_START` moves it for anyone
      # searching further, and the fuzz job below is the arm that explores
      # somewhere new on every run.
      #
      # It is set two orders of magnitude above the default because nothing
      # here is simulated — the registry is driven directly, so this is ~11
      # seconds for 100 000 seeds and 2.7 million requests, against ~50 for
      # the 256 simulated ones above. The default stays at 1 024 so that a
      # contributor's `cargo test` is instant; the depth belongs where the
      # wall clock is already being spent. Leaving it at the default here was
      # the whole argument for this search — that it is nearly free — being
      # made and then not taken.
      - name: Protocol-line search
        run: cargo test --test protocol_lines -- --nocapture
        env:
          JETSTREAM_PROTOCOL_SEEDS: 100000

  # The coverage-guided half of the protocol search.
  #
  # Separate from the job above because libFuzzer needs nightly, and
  # `rust-toolchain.toml` pins the stable release Verus was built against.
  # `fuzz/` is its own workspace so that pin is never in question for anything
  # the other three jobs build.
  #
  # This runs the fuzzer for a minute rather than building it and stopping. A
  # fuzz target that is only ever compiled is a check that says nothing, which
  # is the failure mode the whole simulation suite exists to avoid.
  fuzz:
    name: Protocol fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install a nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # `-max_total_time` rather than a run count, so the budget is what CI can
      # actually afford rather than a number that means something different on
      # every runner. `-rss_limit_mb=0` because the registry keeps its whole
      # audit log and libFuzzer's default limit is about detecting leaks, which
      # is not what this is looking for.
      - name: Fuzz the protocol boundary
        run: cargo +nightly fuzz run protocol -- -max_total_time=60 -rss_limit_mb=0

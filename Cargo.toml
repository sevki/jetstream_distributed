[package]
name = "distributed-ownership"
version = "0.1.0"
edition = "2021"
description = "A formally verified (Verus) model of distributed exclusive ownership with epoch fencing"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "distributed_ownership"
path = "src/lib.rs"

# `vstd` is the Verus standard library. This is the version that ships with
# Verus release 0.2026.09.13.671956e (per the cargo-verus toolchain manifest).
# It is only used when driving verification through `cargo verus`; the primary
# CI entry point (`verus --crate-type=lib src/lib.rs`) uses the prebuilt vstd
# inside the Verus release archive instead.
[dependencies]
vstd = "=0.0.0-2026-09-06-0133"

# Opt this crate into verification.
#
# Without it, `cargo verus verify` builds the crate with ordinary rustc and
# verifies only the dependencies that opted in - which means `vstd`. It still
# exits 0 and still prints `verification results:: N verified, 0 errors`, but
# that summary is vstd's, not this crate's. cargo-verus warns about it
# ("cargo did not find any crates that opted into verification"), and the CI
# step now checks that a summary appears *after* this crate is compiled, so the
# omission cannot come back silently.
[package.metadata.verus]
verify = true

# Verus sets these cfgs when it compiles ghost code; Cargo does not know them,
# so without this every `verus!` block produces two `unexpected_cfgs` warnings.
# Thirty-six lines of noise is how the false-green above stayed hidden.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_keep_ghost)',
  'cfg(verus_keep_ghost_body)',
  'cfg(verus_only)',
] }

# Simulation only. Nothing in `src/` depends on these, and nothing here is
# verified: `tests/` is where the executable protocol lives, for the reason
# `tests/scenario_body/mod.rs` gives — CI rejects unverified code in `src/`, so
# putting a coordinator there would need an escape hatch and fail the build by
# design.
[dev-dependencies]
# A deterministic, simulated network: seeded schedule, simulated clock, and
# `partition`/`repair` as ordinary calls. That determinism is what lets a
# failure be reported as a seed rather than as a story about a flaky afternoon —
# and it is a claim about the whole dependency graph, not just this crate. A
# caret requirement lets the simulator drift within 0.7, which would silently
# reinterpret every committed seed without a change in this repository, so both
# simulation dependencies are pinned exactly and `Cargo.lock` is committed to
# pin what they in turn pull in.
turmoil = "=0.7.2"
# The features the simulation actually uses, rather than `full`: `rt` because
# the coordinator spawns a task per connection, `time` because every wait in
# here is on turmoil's simulated clock, and `io-util` for the line protocol.
tokio = { version = "=1.47.1", features = ["io-util", "rt", "time"] }

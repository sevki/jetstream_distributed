# `vendor/verified-storage` is Microsoft's verified-storage repository, vendored
# whole and verbatim rather than fetched, so that its proofs are checked by this
# repository's CI against this repository's pinned Verus. See `vendor/README.md`.
#
# Its crates are workspace members and not modules because they are somebody
# else's code under somebody else's licence. The one-crate rule this repository
# follows is about the protocols in `src/{algorithm}`; it is not a reason to
# paste a dependency into them.
#
# Only `pmemlog` is a member: it is the one CI verifies. The rest of the tree is
# there, unmodified, but its crates (`multilog`, `capybarakv` and their proc
# macros) are excluded until a job verifies them too, because `multilog` and
# `capybarakv` have a `build.rs` that needs `bindgen` and PMDK headers.
#
# `fuzz/` stays excluded: it needs nightly, and `rust-toolchain.toml` pins the
# stable release Verus was built against.
[workspace]
members = ["vendor/verified-storage/pmemlog"]
exclude = [
  "fuzz",
  "vendor/verified-storage/multilog",
  "vendor/verified-storage/capybaraKV",
  "vendor/verified-storage/unverified",
]

[package]
name = "jetstream_distributed"
version = "0.1.0"
edition = "2024"
description = "Machine-checked distributed protocols, and the Jetstream services that speak them"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "jetstream_distributed"
path = "src/lib.rs"

[[example]]
name = "actor_basic"
path = "src/actor/examples/basic.rs"
required-features = ["service"]

# The examples the book embeds (`book/src/examples.md`). Each asserts what it
# shows, and CI runs them, so a page of the book cannot describe code that no
# longer works.
[[example]]
name = "actor_hosting"
path = "src/actor/examples/hosting.rs"
required-features = ["service"]

[[example]]
name = "ownership_handover"
path = "src/ownership/examples/handover.rs"
required-features = ["service"]

[[example]]
name = "swim_membership"
path = "src/swim/examples/membership.rs"
required-features = ["service"]

[[example]]
name = "swim_node"
path = "src/swim/examples/node.rs"
required-features = ["service"]

# The services live in `src/{algorithm}/service.rs`, in this crate, behind the
# `service` feature, which is **on by default** so that depending on the crate
# gives you the services.
#
# The proofs do not use it. They are checked by `verus --crate-type=lib
# src/lib.rs`, which does not read this file's features at all, and by `cargo
# verus verify --no-default-features`, so the verified build's dependency graph
# is `vstd` and nothing else — no Jetstream, no tokio, no async runtime for Verus
# to be asked about. Turn the feature on and the same modules compile against the
# same verified step functions.
#
# The rule that keeps that true: a module outside `service` and `crush` uses `std`
# and `vstd` and nothing else: no Jetstream type, no `rand`, and no `thiserror`
# (errors write their own `Display`), because the bare `verus` build has no way to
# build a dependency. CI builds `--no-default-features` and each feature alone, and
# runs the bare `verus` build, to hold it.
#
# It also keeps the toolchain question honest. `rust-toolchain.toml` pins the
# Rust release the Verus build was made against, and that pin exists so the
# proofs verify, not so a service is stuck on it. The services build with
# `cargo +stable`, which is what Jetstream tracks.
[features]
default = ["service", "crush", "iroh", "quic"]
# Everything that needs Jetstream, tokio or a random number generator: the
# services, and the Vivaldi coordinates they exchange. Also `humansize`, which
# prints a `Memory` for people, and `sysinfo`, which a node reads its own
# resources with.
service = ["dep:jetstream", "dep:tokio", "dep:rand", "dep:humansize", "dep:url", "dep:sysinfo"]
# Placement by CRUSH. A feature of its own because it is a dependency of its own
# (`mycrush`), and because it needs nothing of Jetstream: it places on `Id`s.
crush = ["dep:mycrush"]
#
iroh = ["dep:iroh", "jetstream/iroh"]
quic = ["jetstream/quic", "dep:quinn"]

[dependencies]
# `vstd` is the Verus standard library. This is the version that ships with
# Verus release 0.2026.09.20.aef82ed (per the cargo-verus toolchain manifest).
# It is only used when driving verification through `cargo verus`; the primary
# CI entry point (`verus --crate-type=lib src/lib.rs`) uses the prebuilt vstd
# inside the Verus release archive instead.
vstd = "=0.0.0-2026-09-20-0158"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"], optional = true }
# From crates.io by requirement, and built from `vendor/jetstream` by the
# `[patch.crates-io]` table below: the services are written against a tree whose
# `Context` carries the peer identity their design depends on, which is newer than
# the 16.0.0 that is published.
jetstream = { version = "16.0.0", optional = true }
mycrush = { version = "1.0.1", optional = true }
rand = { version = "0.10.3", optional = true }
humansize = { version = "2.1.3", optional = true }
iroh = { version = "1.3.0", optional = true }
url = { version = "2.5.8", optional = true }
quinn = { version = "0.11.12", optional = true }
sysinfo = { version = "0.39.6", optional = true }

# Opt this crate into verification.
#
# Without it, `cargo verus verify` builds the crate with ordinary rustc and
# verifies only the dependencies that opted in - which means `vstd`. It still
# exits 0 and still prints `verification results:: N verified, 0 errors`, but
# that summary is vstd's, not this crate's. cargo-verus warns about it
# ("cargo did not find any crates that opted into verification"), and the CI
# step now checks that a summary appears *after* this crate is compiled, so the
# omission cannot come back silently.
[package.metadata.verus]
verify = true

# Verus sets these cfgs when it compiles ghost code; Cargo does not know them,
# so without this every `verus!` block produces two `unexpected_cfgs` warnings.
# Thirty-six lines of noise is how the false-green above stayed hidden.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_keep_ghost)',
  'cfg(verus_keep_ghost_body)',
  'cfg(verus_only)',
] }

[dev-dependencies]
# A deterministic, simulated network: seeded schedule, simulated clock, and
# `partition`/`repair` as ordinary calls. That determinism is what lets a
# failure be reported as a seed rather than as a story about a flaky afternoon —
# and it is a claim about the whole dependency graph, not just this crate. A
# caret requirement lets the simulator drift within 0.7, which would silently
# reinterpret every committed seed without a change in this repository, so the
# simulation dependencies are pinned exactly and `Cargo.lock` is committed to
# pin what they in turn pull in.
turmoil = "=0.7.2"
tokio = { version = "=1.48", features = ["io-util", "macros", "net", "rt", "time"] }
# The `turmoil` support lives on `jetstream_rpc` and the `jetstream` facade does
# not pass it through, so the service tests depend on the component directly —
# which is exactly what jetstream's own dev-dependencies do for its turmoil
# suite. A dev-dependency rather than an optional one: `cargo verus verify`
# does not build dev-dependencies, so this never reaches the verified build.
jetstream_rpc = { version = "16.0.0", default-features = false, features = ["turmoil"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2.0"

# Jetstream, built from `vendor/jetstream` instead of from crates.io. Every
# `jetstream_*` crate the graph can reach is patched, so there is one copy of each:
# the facade reaches its components by path, and a registry copy of any of them
# next to those would be a second, incompatible `Context`. See `vendor/JETSTREAM.md`
# for what that tree is, and is not.
[patch.crates-io]
jetstream = { path = "vendor/jetstream" }
jetstream_rpc = { path = "vendor/jetstream/components/jetstream_rpc" }
jetstream_wireformat = { path = "vendor/jetstream/components/jetstream_wireformat" }
jetstream_error = { path = "vendor/jetstream/components/jetstream_error" }
jetstream_macros = { path = "vendor/jetstream/components/jetstream_macros" }


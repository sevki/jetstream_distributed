# The coverage-guided front end to the protocol search.
#
# Its own workspace, which is cargo-fuzz's layout and is what keeps the pinned
# stable toolchain in `rust-toolchain.toml` from having to accommodate it:
# libFuzzer needs nightly, and nothing in the main build knows this directory
# exists.
#
# The target shares `ProtocolRun` and `run_protocol` with `tests/protocol_lines.rs`
# rather than reimplementing them. That is the same rule the two turmoil targets
# follow: a fuzzer and a seed walk that have drifted apart are worse than
# either alone, because both go green while the thing they guard has moved.
[package]
name = "jetstream-distributed-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The same exact pins as the dev-dependencies of the crate above, because
# `tests/scenario_body/mod.rs` is compiled into this target too and a different
# simulator here would be a different registry.
turmoil = "=0.7.2"
tokio = { version = "=1.48", features = ["io-util", "rt", "time"] }
jetstream_distributed = { version = "0.1.0", path = ".." }

# A patch table only applies at the root of the workspace it is in, and this is its
# own workspace, so the root's does not reach it: without this it would resolve
# `jetstream` from crates.io at 16.0.0, which has no `session` module. The same
# crates as the root's, for the same reason; see its `[patch.crates-io]`.
[patch.crates-io]
jetstream = { path = "../vendor/jetstream" }
jetstream_rpc = { path = "../vendor/jetstream/components/jetstream_rpc" }
jetstream_wireformat = { path = "../vendor/jetstream/components/jetstream_wireformat" }
jetstream_error = { path = "../vendor/jetstream/components/jetstream_error" }
jetstream_macros = { path = "../vendor/jetstream/components/jetstream_macros" }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[workspace]

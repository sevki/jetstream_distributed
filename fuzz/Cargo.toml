# The coverage-guided front end to the protocol search.
#
# Its own workspace, which is cargo-fuzz's layout and is what keeps the pinned
# stable toolchain in `rust-toolchain.toml` from having to accommodate it:
# libFuzzer needs nightly, and nothing in the main build knows this directory
# exists.
#
# The target shares `ProtocolRun` and `run_protocol` with `tests/protocol_lines.rs`
# rather than reimplementing them. That is the same rule the two turmoil targets
# follow: a fuzzer and a seed walk that have drifted apart are worse than
# either alone, because both go green while the thing they guard has moved.
[package]
name = "jetstream-distributed-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The same exact pins as the dev-dependencies of the crate above, because
# `tests/scenario_body/mod.rs` is compiled into this target too and a different
# simulator here would be a different registry.
turmoil = "=0.7.2"
tokio = { version = "=1.47.1", features = ["io-util", "rt", "time"] }
distributed-ownership = { path = ".." }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[workspace]

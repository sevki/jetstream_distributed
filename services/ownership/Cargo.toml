[package]
name = "jetstream-distributed-ownership"
version = "0.1.0"
edition = "2021"
description = "The verified distributed-ownership protocol, served as a Jetstream service"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, for the reason `fuzz/` is its own workspace: the root
# crate pins the Rust toolchain that the Verus release was built against
# (`rust-toolchain.toml`, 1.98.1), and that pin exists so the proofs verify —
# not so that everything in the repository is stuck on it. Jetstream declares
# no MSRV and is built against current stable. Keeping the service out of the
# root workspace means the proof pin is never in question for it, and a
# Jetstream bump can never quietly move the compiler the proofs are checked
# with.
[workspace]

[dependencies]
# The verified crate. The service uses exactly one thing from it — the fence
# check in `exec` — and that is the point: `FenceGuard::accepts` is the single
# executable function in this repository with a proof that it agrees with the
# model's `may_mutate`. Everything else here is ordinary code that has to be
# argued for in the usual way.
distributed-ownership = { path = "../.." }

# Not `"16.3.1"` from crates.io — that version is not published there (16.0.0
# is the latest release), and this service is written against the working tree,
# whose `Context` carries the peer identity the design depends on. Pinned to the
# exact commit the API was read from rather than to a branch, so the service is
# checked against a tree that cannot move under it.
jetstream = { git = "https://github.com/sevki/jetstream", rev = "9761e74f69c792c28885eaac934d0f070a66281c" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
# The `turmoil` support lives on `jetstream_rpc` and the `jetstream` facade does
# not pass it through, so the test depends on the component directly — which is
# exactly what jetstream's own dev-dependencies do for its turmoil suite.
jetstream_rpc = { git = "https://github.com/sevki/jetstream", rev = "9761e74f69c792c28885eaac934d0f070a66281c", default-features = false, features = ["turmoil"] }
# Pinned exactly, and to the same release the root crate's simulation suite
# pins: a different simulator is a different network, and the two suites are
# meant to be talking about the same one.
turmoil = "=0.7.2"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "rt", "time"] }
